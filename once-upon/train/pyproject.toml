[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "once-upon-train"
version = "0.1.0"
description = "Training pipeline for the once-upon browser storyteller"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "numpy",
    "tokenizers",
    "requests",
]

[tool.setuptools]
py-modules = ["bench", "export", "fixtures", "model", "prepare", "sample", "train"]
